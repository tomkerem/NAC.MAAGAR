    <style>
        body {
            background-color: black;
            color: red;
            text-align: center;
            font-family: 'Secular One', sans-serif;
            padding: 30px 10px;
        }

        .jingle-card {
            border: 2px solid red;
            border-radius: 12px;
            padding: 20px;
            max-width: 600px;
            margin: 20px auto;
            background-color: #111;
        }

        iframe {
            border-radius: 8px;
            border: 2px solid red;
            max-width: 100%;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: red;
            text-decoration: none;
            font-size: 18px;
            border: 2px solid red;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .back-btn:hover {
            color: black;
            background-color: red;
        }

        .dot {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            vertical-align: -3px;
            margin: 0 4px;
        }

        .dot-red { background-color: red; }
        .dot-black { background-color: black; border: 2px solid red; box-sizing: border-box; }

        body {
            background: #000 url('bg-hadracha.jpg') center/cover no-repeat fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        @media (max-width: 600px) {
            body::before { display: none; }
            body {
                padding-top: 155px;
                background:
                    linear-gradient(to bottom, rgba(0,0,0,0) 62%, #000 98%),
                    url('bg-hadracha.jpg') top center / 100% auto no-repeat,
                    #000;
            }
        }
    </style>
</head>
