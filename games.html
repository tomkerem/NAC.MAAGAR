<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NA-C GAMES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:'Segoe UI',Arial,sans-serif;color:#fff;touch-action:none;position:fixed;inset:0}
button{font-family:inherit;touch-action:manipulation}
/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;background:#000}
.screen.on{display:flex}
.screen.on>.animItem{animation:itemIn .45s cubic-bezier(.2,1.3,.4,1) both}
.screen.on>.animItem:nth-child(2){animation-delay:.08s}
.screen.on>.animItem:nth-child(3){animation-delay:.16s}
.screen.on>.animItem:nth-child(4){animation-delay:.24s}
.screen.on>.animItem:nth-child(5){animation-delay:.32s}
.screen.on>.animItem:nth-child(6){animation-delay:.4s}
@keyframes itemIn{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
h1{color:#ff2222;font-size:34px;text-shadow:0 0 22px rgba(255,0,0,.65);letter-spacing:1px}
.sub{color:#bbb;font-size:15px;margin-top:-8px}
.btn{width:min(78vw,320px);padding:15px;border:2px solid #ff2222;border-radius:16px;background:linear-gradient(180deg,#1c0000,#000);color:#fff;font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 0 16px rgba(255,0,0,.28);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.94);box-shadow:0 0 26px rgba(255,0,0,.55)}
.btn.small{width:auto;padding:9px 20px;font-size:15px;border-color:#771111;color:#bbb;background:#0c0000;box-shadow:none}
/* ---------- icon pattern background ---------- */
.patternBg{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.5}
.patternBg span{position:absolute;font-size:26px;opacity:.13;filter:grayscale(60%) brightness(.8)}
/* ---------- player select cards (reference layout) ---------- */
.trophyTop,.plaqueTop{display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 22px rgba(255,30,30,.4));animation:trophyBob 2.6s ease-in-out infinite}
@keyframes trophyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.cardsRow{display:flex;gap:14px;justify-content:center;width:100%}
.pcard{flex:1;max-width:120px;aspect-ratio:1/1.08;border-radius:20px;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.55),0 0 20px rgba(255,0,0,.25);transition:transform .12s;position:relative;overflow:hidden}
.pcard:active{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.55)}
.pcard .bigP{font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45);letter-spacing:-1px}
.pcard .pawns{font-size:15px;letter-spacing:3px;opacity:.9}
.pcard.c2{background:linear-gradient(180deg,#e01313,#7a0505)}
.pcard.c3{background:linear-gradient(180deg,#8f8f8f,#3a3a3a)}
.pcard.c4{background:linear-gradient(180deg,#3d3d3d,#0d0d0d)}
.pcard::after{content:"";position:absolute;top:0;left:0;right:0;height:38%;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent);border-radius:14px 14px 0 0;pointer-events:none}
/* ---------- arena ---------- */
#s_arena{padding:0;background:radial-gradient(circle at 50% 50%,#160000 0%,#000 72%)}
#stage{position:absolute;inset:0}
#hudTop{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:30;pointer-events:none}
#hudTop>*{pointer-events:auto}
#gameTitle{color:#ff5555;font-size:15px;font-weight:700;text-shadow:0 0 10px rgba(255,0,0,.5)}
#timerPill{background:#100000;border:2px solid #ff2222;border-radius:999px;padding:4px 14px;font-size:15px;font-weight:700;color:#fff;min-width:56px;text-align:center;box-shadow:0 0 12px rgba(255,0,0,.3)}
#exitBtn{background:#100000;border:2px solid #ff2222;color:#ff6666;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
/* corner pads */
.pad{position:absolute;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:25;border:3px solid;background:rgba(20,0,0,.72);backdrop-filter:blur(2px);transition:transform .1s,box-shadow .15s}
.pad .pn{font-size:11px;font-weight:700;color:#fff;line-height:1}
.pad .pnum{font-size:22px;font-weight:900;line-height:1.1}
.pad:active,.pad.hit{transform:scale(.85)}
.pad.tl{top:62px;right:12px}
.pad.tr{top:62px;left:12px}
.pad.bl{bottom:14px;right:12px}
.pad.br{bottom:14px;left:12px}
.pad.flash{animation:padFlash .3s}
@keyframes padFlash{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
.pad.shake{animation:padShake .4s}
@keyframes padShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* countdown */
#cdOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:40;pointer-events:none}
#cdOverlay.on{display:flex}
#cdNum{font-size:110px;font-weight:900;color:#ff2222;text-shadow:0 0 44px rgba(255,0,0,.9);animation:cdPop .7s ease-out both}
@keyframes cdPop{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
/* shared arena glow */
.arenaGlow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:78vmin;height:78vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,20,20,.16),transparent 65%);pointer-events:none}
/* race scene: horizontal lanes */
.lane{position:absolute;left:14px;right:14px;border-radius:16px;background:linear-gradient(180deg,#220404,#070000);border:2px solid;overflow:hidden}
.laneStripe{position:absolute;top:50%;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 18px,transparent 18px 38px)}
.finish{position:absolute;top:0;bottom:0;left:0;width:16px;background:repeating-conic-gradient(#eee 0 25%,#151515 0 50%);background-size:16px 16px;border-right:2px solid #fff}
.laneLabel{position:absolute;bottom:5px;left:40px;font-size:12px;font-weight:800;text-shadow:0 0 8px #000;z-index:9;opacity:.85}
.laneFill{position:absolute;top:0;bottom:0;right:0;width:0;background:linear-gradient(90deg,transparent,rgba(255,30,30,.32));border-left:2px solid rgba(255,90,90,.75);transition:width .16s ease-out}
.racer2{position:absolute;bottom:6px;right:8px;font-size:44px;z-index:8;transition:right .16s ease-out}
.racer2 .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#fff;background:#a00;border-radius:8px;padding:1px 7px;border:1.5px solid #fff;z-index:9}
.redbull{filter:sepia(.7) saturate(5) hue-rotate(-35deg) drop-shadow(0 0 7px rgba(255,0,0,.9))}
.bounce{animation:bullBounce .24s}
@keyframes bullBounce{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-10px)}}
.bullEmoji{transform:scaleX(-1);display:inline-block}
.puff{position:absolute;font-size:20px;animation:puffUp .42s ease-out both;z-index:7;pointer-events:none}
@keyframes puffUp{from{opacity:.9;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-20px) scale(1.35)}}
/* tug scene */
.tugStage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;height:190px;border-radius:24px;background:radial-gradient(ellipse at 50% 60%,#260404,#050000 75%);border:2px solid rgba(255,40,40,.4);box-shadow:inset 0 0 46px rgba(255,0,0,.14)}
#ropeLine{position:absolute;top:50%;left:6%;right:6%;height:12px;margin-top:-6px;border-radius:6px;background:repeating-linear-gradient(45deg,#d11,#7a0d0d 9px,#d11 18px);box-shadow:0 0 16px rgba(255,0,0,.55)}
#ropeKnot{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#ff2222;border:3px solid #fff;box-shadow:0 0 18px #f00;transition:left .16s ease-out;z-index:2}
#ropeKnot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#7a0000}
.tugEmoji{position:absolute;top:50%;font-size:56px;margin-top:-42px;z-index:3;transition:none}
.tugL{left:2%;transform:rotate(-10deg)}
.tugR{right:2%;transform:scaleX(-1) rotate(-10deg)}
.meter{position:absolute;top:50%;transform:translateY(-50%);width:18px;height:46%;background:#140000;border:2px solid #551111;border-radius:10px;overflow:hidden;z-index:10}
.meterFill{position:absolute;bottom:0;left:0;right:0;height:0;transition:height .15s ease-out;box-shadow:0 0 10px currentColor}
/* reaction scene */
#sigWrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:16px;z-index:8}
.sigBox{width:96px;padding:16px 0;border-radius:24px;background:linear-gradient(180deg,#1e1e1e,#050505);border:3px solid #3a3a3a;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 0 30px rgba(0,0,0,.9),0 0 18px rgba(255,0,0,.25)}
.lamp{width:54px;height:54px;border-radius:50%;background:#161616;border:2px solid #000;position:relative;transition:background .1s,box-shadow .1s}
.lamp.wait{background:#4a3a00;box-shadow:0 0 18px rgba(255,210,0,.5)}
.lamp.go{background:#ff1a1a;border-color:#fff;box-shadow:0 0 46px rgba(255,20,20,.95),0 0 100px rgba(255,0,0,.5)}
.lamp.go::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid rgba(255,60,60,.8);animation:ringOut 1s ease-out infinite}
@keyframes ringOut{from{transform:scale(1);opacity:1}to{transform:scale(2.1);opacity:0}}
#sigText{font-size:17px;color:#bbb;font-weight:700;text-shadow:0 0 8px #000}
/* timing gauges */
.gauge{position:absolute;width:100px;height:100px;z-index:12}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 8px #000}
.gauge .gl{font-size:11px;color:#bbb;font-weight:700}
.gauge.locked{animation:padFlash .35s}
/* target rush */
.field{position:absolute;top:15%;bottom:17%;left:8%;right:8%;border:2.5px solid rgba(255,40,40,.55);border-radius:24px;background:radial-gradient(circle at 50% 50%,rgba(90,0,0,.3),transparent 78%);box-shadow:inset 0 0 44px rgba(255,0,0,.16)}
.liveTgt{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;border:3.5px solid #fff;cursor:pointer;z-index:15;animation:tgtPop .2s cubic-bezier(.2,1.6,.4,1) both,tgtPulse 1.2s ease-in-out .2s infinite}
@keyframes tgtPop{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes tgtPulse{0%,100%{box-shadow:0 0 14px rgba(255,0,0,.5)}50%{box-shadow:0 0 30px rgba(255,30,30,.95)}}
.burst{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;border:4px solid #fff;z-index:14;animation:burstOut .38s ease-out both;pointer-events:none}
@keyframes burstOut{from{transform:scale(.6);opacity:1}to{transform:scale(2.4);opacity:0}}
.miniScore{position:absolute;bottom:110px;left:84px;right:84px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;z-index:20;pointer-events:none}
.miniScore div{background:rgba(15,0,0,.85);border:2px solid;border-radius:12px;padding:3px 6px 3px 4px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;direction:rtl}
.miniScore .pv2{background:#ff2222;color:#fff;min-width:24px;height:24px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;border:1.5px solid #fff;padding:0 4px}
/* result/final */
.bigTitle{font-size:30px;color:#ff2222;text-shadow:0 0 20px rgba(255,0,0,.7);text-align:center;animation:itemIn .45s both}
.msg{font-size:16px;color:#fff;max-width:92%;line-height:1.6;text-align:center}
.msg b{color:#ff3333;unicode-bidi:isolate}
.scoreLine{font-size:22px;margin:3px;animation:itemIn .4s ease-out both}
.scoreLine b{color:#ff3333;unicode-bidi:isolate}
.trophy{font-size:80px;animation:trophyIn .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes trophyIn{0%{transform:scale(0) rotate(-30deg);opacity:0}70%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
/* splash opening */
#splash{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;cursor:pointer;transition:opacity .45s}
#splash.hide{opacity:0;pointer-events:none}
#splashLogo{width:min(86vw,400px);height:auto;border-radius:18px;filter:drop-shadow(0 0 34px rgba(255,0,0,.55));animation:logoIn 1.1s cubic-bezier(.2,1.4,.4,1) both,logoPulse 2.2s ease-in-out 1.15s infinite}
@keyframes logoIn{0%{transform:scale(.25) rotate(-8deg);opacity:0}60%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes logoPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 26px rgba(255,0,0,.45))}50%{transform:scale(1.035);filter:drop-shadow(0 0 46px rgba(255,0,0,.72))}}
#splashHint{color:#f66;font-size:15px;animation:hintBlink 1.4s ease-in-out infinite}
@keyframes hintBlink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){
  .screen.on>.animItem,.btn,.scoreLine,.trophy,.trophyTop,.centerGoal,#splashLogo,#splashHint,.patternBg span{animation:none !important}
  .racer,#ropeKnot,.tugEmoji{transition:none}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#s_arena,#s_arena *{touch-action:none}
img{-webkit-user-drag:none}
/* ---------- WINNER overlay ---------- */
.winFx{position:fixed;inset:0;z-index:120;pointer-events:none;overflow:hidden}
.winTint{position:absolute;inset:0}
.winRibbon{position:absolute;top:50%;left:50%;width:150vw;height:78px;transform:translate(-50%,-50%) rotate(-7deg);border-top:3px solid rgba(255,255,255,.4);border-bottom:3px solid rgba(255,255,255,.4);box-shadow:0 10px 40px rgba(0,0,0,.6);animation:ribbonIn .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes ribbonIn{from{transform:translate(-50%,-50%) rotate(-7deg) scaleX(0)}to{transform:translate(-50%,-50%) rotate(-7deg) scaleX(1)}}
.winBanner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-7deg);text-align:center;animation:winPop .65s cubic-bezier(.18,1.7,.35,1) both .12s}
@keyframes winPop{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(.2)}60%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1.14)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}}
.winWord{font-size:clamp(44px,13.5vw,84px);font-weight:900;letter-spacing:1px;color:#fff;-webkit-text-stroke:2px #140000;text-shadow:0 4px 0 #140000,0 0 34px rgba(0,0,0,.55);white-space:nowrap;line-height:1.05}
.winSub{margin-top:4px;font-size:clamp(20px,6.5vw,34px);font-weight:900;color:#fff;-webkit-text-stroke:1.2px #140000;text-shadow:0 3px 0 #140000}
.confetti{position:absolute;top:-26px;border-radius:2px;opacity:.95;animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(118vh) rotate(760deg)}}
.screen.preWin>*{visibility:hidden}
/* ---------- v3 additions ---------- */
.chipCol{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0 16px}
.pchip{display:flex;align-items:center;justify-content:space-between;gap:18px;width:min(72vw,290px);border:2px solid;border-radius:12px;padding:8px 16px;background:rgba(15,0,0,.82)}
.pchip .pcName{font-weight:700;color:#eee}
.pchip .pcVal{font-size:20px;font-weight:900}
.sumoRing{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 50% 42%,#3a1508 0%,#200a04 62%,#120402 100%);border:6px solid #d61f26;box-shadow:0 0 0 10px rgba(214,31,38,.14),0 0 46px rgba(214,31,38,.35),inset 0 0 60px rgba(0,0,0,.65)}
.sumoRing::before{content:"";position:absolute;inset:12%;border-radius:50%;border:2px dashed rgba(255,255,255,.16)}
.sumoBull{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;transition:filter .2s;will-change:transform}
.sumoBull.out{filter:grayscale(1) brightness(.4);opacity:.35}
.sumoBull svg{width:100%;height:100%;overflow:visible}
.sumoShadow{position:absolute;left:0;top:0;width:58px;height:16px;margin:-8px 0 0 -29px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(3px)}
.tgtZone{position:absolute;border:2.5px dashed;border-radius:18px;opacity:.9}
.tgtZone .zName{position:absolute;top:6px;right:10px;font-size:13px;font-weight:800;opacity:.85}
.tgtZone .zScore{position:absolute;bottom:6px;right:10px;font-size:22px;font-weight:900}
.liveTgt2{position:absolute;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;border:3.5px solid #fff;cursor:pointer;z-index:18;animation:tgtPop .35s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 0 18px rgba(0,0,0,.5)}
@keyframes tgtPop{from{transform:scale(0)}to{transform:scale(1)}}
.wheelPad{position:absolute;width:118px;height:118px;border-radius:50%;z-index:26;touch-action:none}
.wheelSvg{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}

/* rage monster */
.monsterWrap{position:absolute;left:50%;top:calc(50% + 10px);width:112px;height:104px;transform:translate(-50%,-50%);z-index:6;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));animation:monBreath 2.2s ease-in-out infinite}
.monsterWrap svg{width:100%;height:100%}
@keyframes monBreath{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-52%) scale(1.05)}}
#beam{position:absolute;left:0;top:0;width:190px;height:11px;margin-top:-5px;border-radius:6px;background:linear-gradient(90deg,#ff5040,#d61f26 60%,rgba(214,31,38,.15));box-shadow:0 0 14px rgba(255,60,40,.8);z-index:5;pointer-events:none}
#beamGlow{position:absolute;left:0;top:0;width:190px;height:34px;margin-top:-17px;border-radius:18px;background:radial-gradient(closest-side,rgba(255,70,50,.28),transparent);z-index:4;pointer-events:none;filter:blur(2px)}
.ringBull{position:absolute;left:0;top:0;width:60px;height:60px;z-index:7;pointer-events:none;will-change:transform}
.ringBull svg{width:100%;height:100%;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
/* saw trap */
.sandPit{position:absolute;left:50%;top:calc(50% + 10px);width:min(88vw,84vh);height:min(88vw,84vh);transform:translate(-50%,-50%);border-radius:26px;background:radial-gradient(circle at 50% 40%,#d8c194,#c3a76f 70%,#a98c54);border:5px solid #6b5535;box-shadow:inset 0 0 46px rgba(96,70,30,.55),0 10px 26px rgba(0,0,0,.4);z-index:1}
.sandPit:after{content:"";position:absolute;inset:14px;border-radius:18px;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 26px,rgba(120,95,50,.12) 26px 28px)}
#sawBlade{position:absolute;left:0;top:0;width:66px;height:66px;z-index:8;pointer-events:none;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5))}
#sawBlade svg{width:100%;height:100%;animation:sawSpin .5s linear infinite}
@keyframes sawSpin{to{transform:rotate(360deg)}}
.pad.cooling{opacity:.45;filter:grayscale(.4)}

/* short-viewport (phone landscape): menu screens scroll + compress */
@media (max-height:480px){
  #s_home,#s_mode,#s_pick,#s_result,#s_final{justify-content:flex-start;overflow-y:auto;padding:12px 20px;gap:10px}
  #s_pick h1,#s_home h1{font-size:24px;margin:0}
  #pickList{gap:8px}
  #s_pick .btn{padding:10px 14px;font-size:16px}
  .pcard{max-width:96px}
  #s_result,#s_final{gap:8px;padding:8px 16px}
  #s_result .bigTitle,#s_final .bigTitle{font-size:22px;line-height:1.1;margin:0}
  #s_final .trophy{font-size:40px;margin:0}
  #s_result .msg,#s_final .msg{font-size:13px;line-height:1.35;margin-bottom:4px!important}
  #s_result .chipCol,#s_final .chipCol{gap:4px;margin:2px 0 4px}
  #s_result .pchip,#s_final .pchip{padding:5px 12px;width:min(56vw,250px)}
  #s_result .pchip .pcVal,#s_final .pchip .pcVal{font-size:16px}
  #s_result .btn,#s_final .btn{padding:9px;font-size:15px;width:min(52vw,240px)}
  #s_result .btn.small,#s_final .btn.small{padding:6px 16px;font-size:13px}
}
@media (max-height:480px){
  .pad{width:56px;height:56px}
  .pad .pnum{font-size:16px}
  .pad .pn{font-size:10px}
  .laneLabel{left:80px}
}

</style>
</head>

  <button class="btn small" onclick="location.href='index.html'">⬅ חזרה לאתר</button>
</div>

<script>
"use strict";
/* iOS zoom/scroll lockdown: rapid taps on pads must not double-tap-zoom or rubber-band */
(function(){
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  document.addEventListener('gesturechange',function(e){e.preventDefault();});
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  var lastEnd=0;
  document.addEventListener('touchend',function(e){
    var n=Date.now();
    if(n-lastEnd<380)e.preventDefault();
    lastEnd=n;
  },{passive:false});
  document.getElementById('s_arena').addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
})();
function $(id){return document.getElementById(id)}
var NAMES=["שחקן 1","שחקן 2","שחקן 3","שחקן 4"];
var COLORS=["#ff2d2d","#3b9dff","#ffd02e","#35d05a"];
var PADPOS=["bl","tr","tl","br"]; /* 2P diagonal first */
var TAPS_WIN=25;

/* splash */
var splashEl=$("splash"),splashGone=false;
function closeSplash(){if(splashGone)return;splashGone=true;splashEl.classList.add("hide");setTimeout(function(){splashEl.remove()},520);}
splashEl.addEventListener("pointerdown",closeSplash);
setTimeout(closeSplash,3400);

/* icon pattern backgrounds (original, emoji glyphs only) */
(function(){
  var glyphs=["🐂","🦂","🐍","🐱","🏆","🎮","⚡","🔥"];
  document.querySelectorAll("[data-pattern]").forEach(function(p){
    var cols=6,rows=10;
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
      var s=document.createElement("span");
      s.textContent=glyphs[(r*cols+c)%glyphs.length];
      s.style.left=((c+.5*(r%2))/cols*100)+"%";
      s.style.top=(r/rows*100)+"%";
      p.appendChild(s);
    }
  });
})();

/* state + navigation */
var mode="free",numPlayers=2,totalRounds=3,roundIdx=0,points=[0,0,0,0],curGame=null,raf=null,timers=[];
var screens=["s_home","s_mode","s_pick","s_intro","s_arena","s_result","s_final"];
function show(id){screens.forEach(function(s){$(s).classList.toggle("on",s===id)});}
function stopLoop(){if(raf)cancelAnimationFrame(raf);raf=null;timers.forEach(clearTimeout);timers=[];}
function later(fn,ms){timers.push(setTimeout(fn,ms));}

document.querySelectorAll("[data-go]").forEach(function(b){
  b.addEventListener("click",function(){
    if(b.dataset.mode)mode=b.dataset.mode;
    show(b.dataset.go);
  });
});
document.querySelectorAll(".pcard").forEach(function(c){
  c.addEventListener("click",function(){
    numPlayers=+c.dataset.n;
    buildPick();show("s_pick");
  });
});
document.querySelectorAll("[data-rounds]").forEach(function(b){
  b.addEventListener("click",function(){totalRounds=+b.dataset.rounds;points=[0,0,0,0];roundIdx=0;pickRoundGame();});
});
$("exitBtn").addEventListener("click",function(){stopLoop();show("s_home");});
$("resMenu").addEventListener("click",function(){show("s_home");});
$("againBtn").addEventListener("click",function(){show("s_home");});

/* game registry */
var GAMES=[
 {id:"race",name:"מירוץ שורים",desc:"לחצו על הכפתור בפינה שלכם שוב ושוב - השור שלכם רץ לגביע שבמרכז! 8 שניות, הכי רחוק מנצח."},
 {id:"react",name:"תגובת שיא",desc:"חכו שהמנורה תידלק באדום... ואז לחצו ראשונים! מי שלוחץ מוקדם מודח מהסיבוב."},
 {id:"timing",name:"עצירת זמן",desc:"המד שלכם עולה ויורד - לחצו בדיוק כשהוא בקטע האדום! הכי קרוב למרכז מנצח."},
 {id:"targets",name:"מטרה נודדת",desc:"לכל שחקן אזור משלו ליד הפינה שלו - תפסו רק את המטרות שקופצות באזור שלכם! 15 שניות, הכי הרבה פגיעות מנצח."},
 {id:"tug",name:"מלחמת חבל",desc:"לחצו מהר כדי למשוך את החבל לצד שלכם! 15 שניות או עד שאחד קובע."},
 {id:"sumo",name:"סומו שורים",desc:"השור שלכם מסתובב לו בזירה - החזיקו את הכפתור כדי להסתער ישר קדימה ולדחוף יריבים החוצה! האחרון בזירה מנצח."},
 {id:"bikes",name:"מירוץ אופניים",desc:"סובבו את ההגה בפינה שלכם כדי לכוון את האופניים במסלול המפותל! שתי הקפות - מי שחוצה ראשון את הקו מנצח."},
 {id:"monster",name:"מפלצת הזעם",desc:"המפלצת מסובבת את הלשון הלוהטת - לחצו בדיוק כשהיא מתקרבת כדי לקפוץ מעליה! מי שנפגע יוצא, האחרון מנצח."},
 {id:"saw",name:"מלכודת המסור",desc:"השורים רצים במעגל והמסור המסתובב רודף אחריהם - לחצו לזינוק מהיר כדי לברוח! האחרון שנשאר מנצח."},
 {id:"hockey",name:"הוקי אוויר",desc:"החזיקו את הכפתור כדי לשגר את שלושת המועדונים שלכם קדימה ולהגן על השער בפינה! דיסקית בפינה שלכם = ספיגה. דקה שלמה, מי שסופג הכי מעט מנצח."},
 {id:"golf",name:"גולף",desc:"לחצו פעם לנעילת כיוון החץ המסתובב, עוד פעם לבחירת העוצמה - והכדור עף! מי שמכניס לחור בכמה שפחות מכות מנצח."},
 {id:"soccer",name:"כדורגל",desc:"השור שלכם רודף אחרי הכדור - לחצו לזינוק ובעיטה חזקה! קבוצת שמאל מול קבוצת ימין, דקה שלמה, הכי הרבה גולים מנצח."},
 {id:"orbit",name:"לוויינים",desc:"כדור לבן מקיף את הטבעת שלכם - שגרו אותו אל הכדור המרכזי המסתובב בדיוק כשהצבע שלכם פונה אליכם! פגיעה בצבע = נקודה לשחקן שלו. 30 שניות."}
];
function buildPick(){
  var w=$("pickList");w.innerHTML="";
  GAMES.forEach(function(g,gi){
    if(typeof g.build!=="function"&&typeof GAMES[gi].build!=="function")return;
    var b=document.createElement("button");b.className="btn animItem";b.textContent=g.name;
    b.addEventListener("click",function(){points=[0,0,0,0];roundIdx=0;startGame(gi);});
    w.appendChild(b);
  });
}
function pickRoundGame(){
  var gi;
  do{gi=Math.floor(Math.random()*GAMES.length)}while(curGame===gi&&GAMES.length>1);
  startGame(gi);
}
function startGame(gi){
  curGame=gi;
  var g=GAMES[gi];
  $("introRound").textContent=mode==="tour"?("סיבוב "+(roundIdx+1)+" מתוך "+totalRounds):"משחק חופשי";
  $("introName").textContent=g.name;
  $("introDesc").textContent=g.desc;
  show("s_intro");
}
$("introGo").addEventListener("click",function(){show("s_arena");buildArena();countdown(function(){GAMES[curGame].start();});});

/* ---------- arena scaffolding ---------- */
var pads=[];
function buildArena(){
  stopLoop();
  var st=$("stage");st.innerHTML="";
  document.querySelectorAll(".pad").forEach(function(p){p.remove()});
  pads=[];
  var ar=$("s_arena");
  for(var i=0;i<numPlayers;i++){
    (function(i){
      var p=document.createElement("div");
      p.className="pad "+PADPOS[i];
      p.style.borderColor=COLORS[i];
      p.style.boxShadow="0 0 14px "+COLORS[i]+"55";
      p.innerHTML='<div class="pnum" style="color:'+COLORS[i]+'">'+(i+1)+'</div><div class="pn">'+NAMES[i]+'</div>';
      p.addEventListener("pointerdown",function(e){e.preventDefault();if(GAMES[curGame].tap)GAMES[curGame].tap(i);});
      p.addEventListener("pointerup",function(e){if(GAMES[curGame].release)GAMES[curGame].release(i);});
      p.addEventListener("pointercancel",function(e){if(GAMES[curGame].release)GAMES[curGame].release(i);});
      p.addEventListener("pointerleave",function(e){if(GAMES[curGame].release)GAMES[curGame].release(i);});
      ar.appendChild(p);pads.push(p);
    })(i);
  }
  $("gameTitle").textContent=GAMES[curGame].name;
  $("timerNum").textContent="";
  $("timerPill").style.display="none";
  GAMES[curGame].build($("stage"));
}
function countdown(cb){
  var o=$("cdOverlay"),n=$("cdNum");o.classList.add("on");
  var seq=["3","2","1"];var k=0;
  (function step(){
    if(k<seq.length){n.textContent=seq[k];n.style.animation="none";void n.offsetWidth;n.style.animation="";k++;later(step,750);}
    else{o.classList.remove("on");cb();}
  })();
}
function startTimer(sec,onTick,onEnd){
  $("timerPill").style.display="";
  var left=sec;$("timerNum").textContent=left;
  (function tick(){
    later(function(){
      left--;$("timerNum").textContent=left;
      if(onTick)onTick(left);
      if(left>0)tick();else if(onEnd)onEnd();
    },1000);
  })();
}
function perPlayer(arr){return arr.map(function(c,i){return "<bdi>"+NAMES[i]+"</bdi> <b>"+c+"</b>"}).join(" · ")}
function flashPad(i){pads[i].classList.remove("flash");void pads[i].offsetWidth;pads[i].classList.add("flash");}
function shakePad(i){pads[i].classList.remove("shake");void pads[i].offsetWidth;pads[i].classList.add("shake");}
function padCenter(i){var r=pads[i].getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}

/* ---------- round end / results ---------- */
function endRound(winnerIdx,detail){
  stopLoop();
  if(winnerIdx!=null&&winnerIdx>=0)points[winnerIdx]++;
  $("resTitle").textContent=winnerIdx==null?"תיקו!":(NAMES[winnerIdx]+" לוקח!");
  var h="";
  if(detail)h+='<div class="msg" style="margin-bottom:14px">'+detail+"</div>";
  $("resBody").innerHTML=h;
  $("resNext").textContent="עוד סיבוב";
  $("resNext").onclick=function(){startGame(curGame);};
  $("s_result").classList.add("preWin");
  show("s_result");
  winFx(winnerIdx);
}
function winFx(winnerIdx){
  var old=document.querySelector('.winFx');if(old)old.remove();
  var col=winnerIdx!=null?COLORS[winnerIdx]:'#8a8a8a';
  var fx=document.createElement('div');fx.className='winFx';
  var tint=document.createElement('div');tint.className='winTint';
  tint.style.background='radial-gradient(circle at 50% 42%, '+col+'2e, transparent 72%)';
  fx.appendChild(tint);
  var rib=document.createElement('div');rib.className='winRibbon';
  rib.style.background='linear-gradient(180deg,'+col+' 0%, #0a0000 130%)';
  fx.appendChild(rib);
  var bn=document.createElement('div');bn.className='winBanner';
  bn.innerHTML='<div class="winWord" dir="ltr">'+(winnerIdx==null?'TIE!':'WINNER')+'</div>'+(winnerIdx!=null?'<div class="winSub">'+NAMES[winnerIdx]+'</div>':'');
  fx.appendChild(bn);
  var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduced){
    var pal=[col,'#ffffff','#ff2222','#9a9a9a'];
    for(var i=0;i<64;i++){
      var c=document.createElement('span');c.className='confetti';
      var s=6+Math.random()*9;
      c.style.left=(Math.random()*100)+'vw';
      c.style.width=s+'px';c.style.height=(s*0.45+Math.random()*6)+'px';
      c.style.background=pal[i%pal.length];
      c.style.animationDuration=(1.6+Math.random()*1.6)+'s';
      c.style.animationDelay=(Math.random()*1.1)+'s';
      if(i%3===0)c.style.borderRadius='50%';
      fx.appendChild(c);
    }
  }
  document.body.appendChild(fx);
  fx.style.pointerEvents='auto';
  setTimeout(function(){var r=document.getElementById('s_result');if(r)r.classList.remove('preWin');fx.style.transition='opacity .5s';fx.style.opacity='0';setTimeout(function(){fx.remove();},520);},3400);
}
function finishAll(){show("s_home");}
/* ============ game 1: bull race - horizontal lanes ============ */
GAMES[0].build=function(st){
  st.innerHTML='<div class="arenaGlow"></div>';
  this.taps=[];this.racers=[];this.fills=[];this.over=false;
  var H=innerHeight,W=innerWidth;
  var top=H<480?120:104,bottom=H-(H<480?84:128),areaH=bottom-top;
  var laneH=Math.min(84,(areaH-(numPlayers-1)*12)/numPlayers);
  var totalH=numPlayers*laneH+(numPlayers-1)*12;
  var y0=top+(areaH-totalH)/2;
  this.laneW=W-28;
  for(var i=0;i<numPlayers;i++){
    this.taps.push(0);
    var lane=document.createElement('div');
    lane.className='lane';lane.style.borderColor=COLORS[i];
    lane.style.height=laneH+'px';lane.style.top=(y0+i*(laneH+12))+'px';
    lane.style.boxShadow='0 0 16px '+COLORS[i]+'44';
    lane.innerHTML='<div class="laneStripe"></div><div class="finish"></div>'
      +'<div class="laneFill"></div>'
      +'<div class="laneLabel" style="color:'+COLORS[i]+'"><bdi>'+NAMES[i]+'</bdi></div>'
      +'<div class="racer2"><div style="width:46px;height:46px">'+bullTop(COLORS[i])+'</div><div class="tag" style="background:'+COLORS[i]+';'+(COLORS[i]==='#f5f5f5'?'color:#000;':'')+'">'+(i+1)+'</div></div>';
    st.appendChild(lane);
    this.racers.push(lane.querySelector('.racer2'));
    this.fills.push(lane.querySelector('.laneFill'));
    this.place(i);
  }
};
GAMES[0].place=function(i){
  var p=Math.min(this.taps[i]/TAPS_WIN,1);
  this.racers[i].style.right=(8+p*(this.laneW-78))+'px';
  this.fills[i].style.width=(p*100)+'%';
};
GAMES[0].tap=function(i){
  if(this.over)return;
  this.taps[i]++;this.place(i);flashPad(i);
  var r=this.racers[i],b=r.querySelector('.bullEmoji');
  b.classList.remove('bounce');void b.offsetWidth;b.classList.add('bounce');
  var pf=document.createElement('div');pf.className='puff';pf.textContent='💨';
  pf.style.bottom='4px';pf.style.right=(parseInt(r.style.right)+46)+'px';
  r.parentElement.appendChild(pf);setTimeout(function(){pf.remove()},440);
  if(this.taps[i]>=TAPS_WIN){this.over=true;this.finish();}
};
GAMES[0].start=function(){
  var g=this;
  startTimer(8,null,function(){if(!g.over){g.over=true;g.finish();}});
};
GAMES[0].finish=function(){
  var mx=Math.max.apply(null,this.taps),win=this.taps.indexOf(mx);
  var tie=this.taps.filter(function(t){return t===mx}).length>1;
  endRound(tie?null:win,"מכות שור: "+perPlayer(this.taps));
};

/* ============ game 2: reaction - signal box ============ */
GAMES[1].build=function(st){
  st.innerHTML='<div class="arenaGlow"></div><div id="sigWrap"><div class="sigBox"><div class="lamp" id="lampWait"></div><div class="lamp" id="lampGo"></div></div><div id="sigText">חכו לאדום...</div></div>';
  this.go=false;this.done=false;this.out=[];
};
GAMES[1].start=function(){
  $("lampWait").classList.add("wait");
  var g=this;
  later(function(){
    if(g.done)return;
    g.go=true;
    $("lampWait").classList.remove("wait");
    $("lampGo").classList.add("go");
    $("sigText").textContent="עכשיו!!!";
    g.t0=performance.now();
  },1200+Math.random()*2600);
};
GAMES[1].tap=function(i){
  if(this.done||this.out.indexOf(i)>=0)return;
  var g=this;
  if(!this.go){
    this.out.push(i);shakePad(i);
    $("sigText").textContent=NAMES[i]+" לחץ מוקדם מדי!";
    if(this.out.length===numPlayers){g.done=true;endRound(null,"כולם לחצו מוקדם!");}
    else if(this.out.length===numPlayers-1){
      var last=-1;for(var k=0;k<numPlayers;k++)if(g.out.indexOf(k)<0)last=k;
      g.done=true;
      endRound(last,"כולם נשרו - "+NAMES[last]+" נשאר אחרון!");
    }
    return;
  }
  this.done=true;
  flashPad(i);
  var ms=Math.round(performance.now()-this.t0);
  endRound(i,"זמן תגובה: <b>"+ms+"ms</b>");
};

/* ============ game 3: timing gauges ============ */
GAMES[2].build=function(st){
  st.innerHTML='<div class="arenaGlow"></div>';
  this.vals=[];this.locked=[];this.els=[];this.running=false;
  for(var i=0;i<numPlayers;i++){
    this.vals.push(0);this.locked.push(false);
    var pc=padCenter(i);
    var gx=pc.x+(innerWidth/2-pc.x)*0.3-50, gy=pc.y+(innerHeight/2-pc.y)*0.3-50;
    var g=document.createElement("div");
    g.className="gauge";
    g.style.left=gx+"px";g.style.top=gy+"px";
    g.innerHTML='<svg width="100" height="100">'
      +'<circle cx="50" cy="50" r="41" stroke="#200000" stroke-width="12" fill="rgba(12,0,0,.8)"/>'
      +'<circle cx="50" cy="50" r="41" stroke="#6a0000" stroke-width="14" fill="none" stroke-dasharray="25.8 231.9" stroke-dashoffset="-116"/>'
      +'<circle class="arc" cx="50" cy="50" r="41" stroke="'+COLORS[i]+'" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="257.6" stroke-dashoffset="257.6"/>'
      +'</svg><div class="gv"><div class="gl">'+NAMES[i]+'</div><div class="vv">0%</div></div>';
    st.appendChild(g);
    this.els.push(g);
  }
};
GAMES[2].start=function(){
  this.running=true;var g=this,t0=performance.now();
  (function loop(){
    if(!g.running)return;
    var t=(performance.now()-t0)/1500;
    for(var i=0;i<numPlayers;i++){

GAMES[5].step=function(dt){

    b.x+=b.vx*dt;b.y+=b.vy*dt;
    var sp=Math.hypot(b.vx,b.vy);

  });

  for(var i=0;i<this.b.length;i++)for(var j=i+1;j<this.b.length;j++){

};

/* ============ bicycle race: winding circuit + corner steering wheels ============ */
GAMES[6].build=function(st){
  var W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
  document.getElementById('s_arena').style.background='radial-gradient(circle at 50% 50%,#1b1b1f 0%,#08080a 72%,#030304 100%)';
  this.st=st;this.over=false;this.go=false;
  st.innerHTML='<canvas id="bikeCv" style="position:absolute;inset:0;width:100%;height:100%"></canvas>';
  var cv=st.querySelector('#bikeCv');
  cv.width=W*dpr;cv.height=H*dpr;
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  this.ctx=ctx;this.W=W;this.H=H;
  /* centerline: wobbly closed loop */
  var cx=W/2,cy=H/2,R0=Math.min(W,H)*(W>H?0.40:0.315),N=720,pts=[],cum=[0];
  for(var k=0;k<N;k++){
    var th=k/N*Math.PI*2;
    var r=R0*(1+0.30*Math.sin(3*th+1.1)+0.13*Math.sin(5*th+2.2));
    /* keep clear of corner wheels: clamp into safe rect */
    var x=cx+Math.cos(th)*r*1.28,y=cy+Math.sin(th)*r*0.86;
    pts.push([x,y]);
  }
  /* fit course into a safe rect, then push the line out of the corner wheels */
  var mnY=1e9,mxY=-1e9,mnX=1e9,mxX=-1e9;
  for(var k=0;k<N;k++){if(pts[k][1]<mnY)mnY=pts[k][1];if(pts[k][1]>mxY)mxY=pts[k][1];if(pts[k][0]<mnX)mnX=pts[k][0];if(pts[k][0]>mxX)mxX=pts[k][0];}
  var yT=Math.max(36,H*0.09),yB=H-Math.max(48,H*0.12),xL=34,xR=W-34;
  for(var k=0;k<N;k++){pts[k][0]=xL+(pts[k][0]-mnX)/(mxX-mnX)*(xR-xL);pts[k][1]=yT+(pts[k][1]-mnY)/(mxY-mnY)*(yB-yT);}
  var clearR=59+Math.min(W,H)*0.115/2+14;
  var cors=[[69,117],[W-69,117],[69,H-71],[W-69,H-71]];
  var cx2=W/2,cy2=(yT+yB)/2;
  for(var it=0;it<30;it++){
    var bad=false;
    for(var k=0;k<N&&!bad;k++)for(var c=0;c<4;c++){
      var cdx=pts[k][0]-cors[c][0],cdy=pts[k][1]-cors[c][1];
      if(cdx*cdx+cdy*cdy<clearR*clearR){bad=true;break;}
    }
    if(!bad)break;
    for(var k=0;k<N;k++){pts[k][0]=cx2+(pts[k][0]-cx2)*0.97;pts[k][1]=cy2+(pts[k][1]-cy2)*0.97;}
  }
  for(var k=1;k<=N;k++){var a=pts[k-1],b=pts[k%N];cum.push(cum[k-1]+Math.hypot(b[0]-a[0],b[1]-a[1]));}
  this.pts=pts;this.cum=cum;this.N=N;this.total=cum[N];
  this.roadW=Math.min(W,H)*0.115;
  /* start index: bottom of course */
  var si=0,my=-1e9;for(var k=0;k<N;k++){if(pts[k][1]>my){my=pts[k][1];si=k;}}
  this.startIdx=si;
  /* hide tap pads, build steering wheels at the same corners */
  pads.forEach(function(p){p.style.display='none';});
  this.wheels=[];this.bikes=[];
  var WPOS={tl:{left:'auto',right:'10px',top:'58px'},tr:{right:'auto',left:'10px',top:'58px'},bl:{left:'auto',right:'10px',bottom:'12px'},br:{right:'auto',left:'10px',bottom:'12px'}};
  for(var i=0;i<numPlayers;i++){
    var wp=WPOS[PADPOS[i]];
    var w=document.createElement('div');w.className='wheelPad';
    for(var k in wp)w.style[k]=wp[k];
    w.innerHTML='<svg class="wheelSvg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#101010" stroke="'+COLORS[i]+'" stroke-width="5"/><circle cx="50" cy="50" r="14" fill="#1c1c1c" stroke="'+COLORS[i]+'" stroke-width="3.5"/><path d="M50 8 L50 36 M12 71 L38 56 M88 71 L62 56" stroke="'+COLORS[i]+'" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="5" fill="#eee"/></svg>';
    st.appendChild(w);
    var wh={el:w.querySelector('.wheelSvg'),ang:0,held:false,lastA:0};
    (function(i,w,wh){
      var rot=function(e){
        var r=w.getBoundingClientRect();
        var a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));
        var d=a-wh.lastA;
        if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
        wh.lastA=a;wh.lastT=performance.now();wh.ang=Math.max(-1.3,Math.min(1.3,wh.ang+d));
      };
      w.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();wh.held=true;wh.lastT=performance.now();var r=w.getBoundingClientRect();wh.lastA=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));w.setPointerCapture(e.pointerId);});
      w.addEventListener('pointermove',function(e){if(wh.held)rot(e);});
      w.addEventListener('pointerup',function(){wh.held=false;});
      w.addEventListener('pointercancel',function(){wh.held=false;});
    })(i,w,wh);
    this.wheels.push(wh);
    /* grid slots behind start line */
    var back=(si-14-i*10+this.N)%this.N;
    var p0=pts[back],p1=pts[(back+1)%N];
    var tx=p1[0]-p0[0],ty=p1[1]-p0[1],tl2=Math.hypot(tx,ty);tx/=tl2;ty/=tl2;
    var lat=(i-(numPlayers-1)/2)*12;
    this.bikes.push({idx:back,prog:0,lap:0,x:p0[0]-ty*lat,y:p0[1]+tx*lat,hd:Math.atan2(ty,tx),sp:0,lat:lat,dust:0});
  }
  var g=this;
  physLoop(function(dt){g.step(dt);});
};
GAMES[6].step=function(dt){
  if(this.over||!this.go)return;
  var g=this,N=this.N;
  this.bikes.forEach(function(bk,i){
    var wh=g.wheels[i];
    if(!wh.held)wh.ang*=Math.pow(0.02,dt); /* spring to center */
    wh.el.style.transform='rotate('+(wh.ang*180/Math.PI)+'deg)';
    bk.ped=(bk.ped||0)+bk.sp*dt*0.055;
    var active=wh.held||(performance.now()-(wh.lastT||0)<1200);
    if(active){
      bk.sp+=(150-bk.sp)*dt*1.4;
      bk.hd+=wh.ang*2.7*dt*Math.min(bk.sp/120,1);
    }else{
      /* driverless cruise: follow the course gently, slower than active steering */

    winners.forEach(function(w){points[w]++;});
    $("resTitle").textContent=winners.map(function(w){return NAMES[w]}).join(' ו')+(winners.length>1?' לוקחים!':' לוקח!');
    $("resBody").innerHTML='<div class="msg" style="margin-bottom:14px">תוצאה סופית: <b style="color:'+g.cL+'">'+g.goalL+'</b> : <b style="color:'+g.cR+'">'+g.goalR+'</b></div>';
    $("resNext").textContent="עוד סיבוב";
    $("resNext").onclick=function(){startGame(curGame);};
    $("s_result").classList.add("preWin");
    show("s_result");
    winFx(winners[0]);
  });
};

/* ============ orbit: launch your orbiting ball into the spinning center when YOUR color faces you ============ */
GAMES[12].build=function(st){
  var W=innerWidth,H=innerHeight;
  document.getElementById('s_arena').style.background='repeating-conic-gradient(#ff9ecf 0% 25%, #ff86c2 0% 50%) 0 0/64px 64px';
  this.st=st;this.over=false;this.go=false;
  var cx=W/2,cy=H/2+4;
  this.cx=cx;this.cy=cy;this.rot=0;this.score=[];
  var sd=360/numPlayers,grad='',k;
  for(k=0;k<numPlayers;k++){
    grad+=(k?',':'')+COLORS[k]+' '+(k*sd)+'deg '+((k+1)*sd)+'deg';
  }
  var cel=document.createElement('div');
  cel.style.cssText='position:absolute;left:'+(cx-47)+'px;top:'+(cy-47)+'px;width:94px;height:94px;border-radius:50%;background:conic-gradient('+grad+');border:4px solid #fff;box-shadow:0 6px 22px rgba(0,0,0,.4);z-index:8;will-change:transform';
  st.appendChild(cel);
  this.cel=cel;
  var nel=document.createElement('div');
  nel.style.cssText='position:absolute;left:'+(cx-47)+'px;top:'+(cy-47)+'px;width:94px;height:94px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:9;pointer-events:none';
  nel.innerHTML='<div id="orbNum" style="min-width:44px;height:44px;padding:0 6px;border-radius:50%;background:#0d0d0d;border:3px solid #fff;color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center">30</div>';
  st.appendChild(nel);
  this.rings=[];
  var ringR=Math.min(W,H)*0.145;
  for(var i=0;i<numPlayers;i++){
    var pc=padCenter(i);
    var rx=W*(pc.x<W/2?0.28:0.72),ry=H*(pc.y<H/2?0.29:0.7)+4;
    var rel=document.createElement('div');
    rel.style.cssText='position:absolute;left:'+(rx-ringR)+'px;top:'+(ry-ringR)+'px;width:'+(ringR*2)+'px;height:'+(ringR*2)+'px;border-radius:50%;border:'+Math.max(9,ringR*0.24)+'px solid '+COLORS[i]+';box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),0 5px 14px rgba(0,0,0,.3);z-index:6';
    st.appendChild(rel);
    var chip=document.createElement('div');
    var inward=pc.x<W/2?1:-1;
    chip.style.cssText='position:absolute;left:'+(rx+inward*(ringR+14)-22)+'px;top:'+(ry-ringR-40)+'px;min-width:40px;height:34px;padding:0 9px;border-radius:10px;background:#0d0d0d;border:2.5px solid '+COLORS[i]+';color:'+COLORS[i]+';font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:9';
    chip.textContent='0';st.appendChild(chip);
    var oel=document.createElement('div');
    oel.style.cssText='position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 55%,#c9c9c9);border:2.5px solid #333;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:8;will-change:transform';
    st.appendChild(oel);
    this.rings.push({x:rx,y:ry,r:ringR,a:Math.random()*Math.PI*2,w:(1.3+i*0.22)*(i%2?1:-1),st:'orbit',vx:0,vy:0,ox:0,oy:0,wait:0,el:oel,chip:chip});
    this.score.push(0);
  }
  var g=this;
  physLoop(function(dt){g.step(dt);});
};
GAMES[12].tap=function(i){
  if(this.over||!this.go)return;
  var r=this.rings[i];
  if(r.st!=='orbit')return;
  var ox=r.x+Math.cos(r.a)*r.r,oy=r.y+Math.sin(r.a)*r.r;
  var dx=this.cx-ox,dy=this.cy-oy,d=Math.hypot(dx,dy)||1;
  r.st='fly';r.ox=ox;r.oy=oy;r.vx=dx/d*660;r.vy=dy/d*660;
  flashPad(i);
};
GAMES[12].step=function(dt){
  if(this.over||!this.go)return;
  var g=this;
  this.rot=(this.rot+dt*52)%360;
  this.cel.style.transform='rotate('+this.rot+'deg)';
  this.rings.forEach(function(r,i){
    if(r.st==='orbit'){
      r.a+=r.w*dt;
      r.ox=r.x+Math.cos(r.a)*r.r;r.oy=r.y+Math.sin(r.a)*r.r;
    }else if(r.st==='fly'){
      r.ox+=r.vx*dt;r.oy+=r.vy*dt;
      var d=Math.hypot(r.ox-g.cx,r.oy-g.cy);
      if(d<48){
        var th=Math.atan2(r.oy-g.cy,r.ox-g.cx)*180/Math.PI;
        var css=th+90;
        var rel=((css-g.rot)%360+360)%360;
        var s=Math.min(numPlayers-1,Math.floor(rel/(360/numPlayers)));
        g.score[s]++;r.chip.textContent=g.score[s];
        r.chip.style.transition='transform .18s';r.chip.style.transform='scale(1.35)';
        (function(c){setTimeout(function(){c.style.transform='scale(1)'},200);})(r.chip);
        var bu=document.createElement('div');bu.className='burst';bu.style.left=r.ox+'px';bu.style.top=r.oy+'px';bu.style.borderColor=COLORS[s];
        g.st.appendChild(bu);setTimeout(function(){bu.remove()},420);
        if(s===i)flashPad(i);else shakePad(i);
        r.st='wait';r.wait=0.55;
        r.el.style.opacity='0';
      }
    }else{
      r.wait-=dt;
      if(r.wait<=0){r.st='orbit';r.el.style.opacity='1';}
    }
    r.el.style.transform='translate('+r.ox+'px,'+r.oy+'px)';
  });
};
GAMES[12].start=function(){
  var g=this;g.go=true;
  var num=document.getElementById('orbNum');
  startTimer(30,function(left){if(num)num.textContent=left;},function(){
    if(g.over)return;g.over=true;
    var mx=Math.max.apply(null,g.score);
    var winners=g.score.map(function(s,i){return s===mx?i:-1}).filter(function(i){return i>=0});
    endRound(winners.length===1?winners[0]:null,chipRows(g.score));
  });
};
