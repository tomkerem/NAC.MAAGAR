<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>משחקים - NA-C</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#0a0a0a;color:#fff;font-family:Arial,'Segoe UI',sans-serif;overflow:hidden}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
h1.title{margin:26px 0 6px;font-size:34px;font-weight:900;color:#ff2d2d;text-shadow:0 0 18px rgba(255,45,45,.4)}
.sub{color:#bbb;font-size:15px;margin-bottom:22px}
.gcard{width:min(86vw,340px);margin:9px;padding:20px;border-radius:18px;border:3px solid #ff2d2d;background:linear-gradient(160deg,#1a0606,#0d0d0d);font-size:24px;font-weight:900;text-align:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .12s}
.gcard:active{transform:scale(.96)}
.gcard small{display:block;font-size:13px;font-weight:400;color:#bbb;margin-top:6px}
.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:30}
.tbtn{padding:8px 14px;border-radius:12px;border:2px solid #ff2d2d;background:rgba(20,0,0,.85);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.gtitle{font-size:22px;font-weight:900;color:#ff2d2d;margin-top:52px}
.turn{margin:8px 0 4px;font-size:17px;font-weight:800;min-height:24px}
.turn b{color:#ff2d2d}
#boardWrap{position:relative;touch-action:manipulation}
table.board{border-collapse:collapse;border:4px solid #4a2c12;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
td.sq{width:11.5vw;height:11.5vw;max-width:62px;max-height:62px;position:relative}
td.lt{background:#e8cf9f}td.dk{background:#7a4a22}
td.sel{outline:4px solid #ffd02e;outline-offset:-4px}
td.dot::after{content:'';position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(20,255,120,.75);box-shadow:0 0 8px rgba(20,255,120,.8)}
td.cap::after{background:rgba(255,60,60,.85);box-shadow:0 0 10px rgba(255,60,60,.9)}
.pc{position:absolute;left:7%;top:7%;width:86%;height:86%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:5.4vw;transition:left .18s,top .18s;pointer-events:none}
@media(min-width:560px){.pc{font-size:30px}}
.pc.r{background:radial-gradient(circle at 35% 30%,#ff7a6b,#d41e0f 60%,#8f0f05);border:3px solid #300;color:#fff;text-shadow:0 1px 2px #000}
.pc.w{background:radial-gradient(circle at 35% 30%,#fff,#cfcfcf 60%,#8f8f8f);border:3px solid #222;color:#333}
.pc.k::after{content:'♛';font-size:70%}
.caps{display:flex;gap:18px;margin-top:10px;font-size:14px;color:#ccc}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:16px}
.overlay.on{display:flex}
.overlay h2{font-size:34px;font-weight:900;color:#ffd02e;text-shadow:0 0 20px rgba(255,208,46,.5)}
.obtn{padding:14px 34px;border-radius:14px;border:3px solid #ff2d2d;background:#1a0606;color:#fff;font-size:19px;font-weight:900;cursor:pointer}
.note{margin-top:10px;font-size:13px;color:#888}
</style>
</head>
<body>

<div class="screen on" id="s_menu">
  <h1 class="title">משחקים</h1>
  <div class="sub">שחקו נגד המחשב או שניים על אותו טלפון</div>
  <div class="gcard" onclick="pickMode('checkers')">דמקה<small>לכידות חובה, מלכים, עד הסוף</small></div>
  <div style="height:18px"></div>
  <a href="index.html" style="color:#888;font-size:14px">חזרה לדף הבית</a>
</div>

<div class="screen" id="s_mode">
  <h1 class="title" id="modeTitle">דמקה</h1>
  <div class="sub">איך משחקים?</div>
  <div class="gcard" onclick="startCheckers('ai')">נגד המחשב</div>
  <div class="gcard" onclick="startCheckers('2p')">שני שחקנים</div>
  <div style="height:14px"></div>
  <button class="tbtn" onclick="show('s_menu')">חזרה</button>
</div>

<div class="screen" id="s_game">
  <div class="topbar">
    <button class="tbtn" onclick="show('s_menu')">✕ יציאה</button>
    <button class="tbtn" onclick="startCheckers(curMode)">↻ משחק חדש</button>
  </div>
  <div class="gtitle">דמקה</div>
  <div class="turn" id="turnTxt"></div>
  <div id="boardWrap"></div>
  <div class="caps" id="capsTxt"></div>
  <div class="note">לחיצה על כלי מראה מהלכים אפשריים. לכידה היא חובה.</div>
</div>

<div class="overlay" id="s_over">
  <h2 id="overTitle"></h2>
  <button class="obtn" onclick="startCheckers(curMode)">משחק חדש</button>
  <button class="obtn" onclick="show('s_menu')">לתפריט</button>
</div>

<script>
function $(id){return document.getElementById(id);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
function pickMode(g){if(g==='checkers'){$('modeTitle').textContent='דמקה';show('s_mode');}}

/* ============ checkers engine ============ */
var CK={};
CK.newBoard=function(){var b=[];for(var r=0;r<8;r++)b.push([0,0,0,0,0,0,0,0]);
  for(var r=0;r<3;r++)for(var c=0;c<8;c++)if((r+c)%2===1)b[r][c]=-1;
  for(var r=5;r<8;r++)for(var c=0;c<8;c++)if((r+c)%2===1)b[r][c]=1;return b;};
CK.own=function(v,s){return s>0?v>0:v<0;};
CK.king=function(v){return Math.abs(v)===2;};
CK.dirs=function(v){if(CK.king(v))return[[1,1],[1,-1],[-1,1],[-1,-1]];return v>0?[[-1,1],[-1,-1]]:[[1,1],[1,-1]];};
CK.moves=function(b,side){var caps=[],quiet=[];
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){var v=b[r][c];if(!CK.own(v,side))continue;
    CK.jumps(b,r,c,v,[],[[r,c]],caps);
    var ds=CK.dirs(v);
    for(var k=0;k<ds.length;k++){var r2=r+ds[k][0],c2=c+ds[k][1];
      if(r2>=0&&r2<8&&c2>=0&&c2<8&&b[r2][c2]===0)quiet.push({fr:r,fc:c,tr:r2,tc:c2,captures:[]});}}
  return caps.length?caps:quiet;};
CK.jumps=function(b,r,c,v,capd,vis,out){var ds=[[1,1],[1,-1],[-1,1],[-1,-1]],found=false;
  for(var k=0;k<ds.length;k++){var r1=r+ds[k][0],c1=c+ds[k][1],r2=r+2*ds[k][0],c2=c+2*ds[k][1];
    if(r2<0||r2>7||c2<0||c2>7)continue;var mid=b[r1][c1];
    if(mid===0||CK.own(mid,v>0?1:-1))continue;if(b[r2][c2]!==0)continue;
    if(capd.some(function(p){return p[0]===r1&&p[1]===c1;}))continue;
    found=true;var nb=b.map(function(row){return row.slice();});
    nb[r][c]=0;var nv=v,promotes=(v===1&&r2===0)||(v===-1&&r2===7);if(promotes)nv=v*2;nb[r2][c2]=nv;
    var ncap=capd.concat([[r1,c1]]);
    if(promotes){out.push({fr:vis[0][0],fc:vis[0][1],tr:r2,tc:c2,captures:ncap});continue;}
    CK.jumps(nb,r2,c2,nv,ncap,vis.concat([[r2,c2]]),out);}
  if(!found&&capd.length)out.push({fr:vis[0][0],fc:vis[0][1],tr:r,tc:c,captures:capd});};
CK.apply=function(b,m){var nb=b.map(function(row){return row.slice();});var v=nb[m.fr][m.fc];nb[m.fr][m.fc]=0;
  for(var i=0;i<m.captures.length;i++)nb[m.captures[i][0]][m.captures[i][1]]=0;
  if((v===1&&m.tr===0)||(v===-1&&m.tr===7))v=v*2;nb[m.tr][m.tc]=v;return nb;};
CK.eval=function(b){var s=0;for(var r=0;r<8;r++)for(var c=0;c<8;c++){var v=b[r][c];if(!v)continue;
  var p=CK.king(v)?300:100;p+=(3.5-Math.abs(3.5-c))*4;if(!CK.king(v))p+=v>0?(7-r)*6:r*6;
  if(r===0||r===7)p+=8;s+=v>0?p:-p;}return s;};
CK.negamax=function(b,depth,alpha,beta,side){var ms=CK.moves(b,side);
  if(!ms.length)return{score:-100000-depth};if(depth===0)return{score:side*CK.eval(b)};
  ms.sort(function(a,b2){return b2.captures.length-a.captures.length;});var best=null;
  for(var i=0;i<ms.length;i++){var nb=CK.apply(b,ms[i]);var res=CK.negamax(nb,depth-1,-beta,-alpha,-side);
    var sc=-res.score;if(sc>alpha){alpha=sc;best=ms[i];}if(alpha>=beta)break;}
  return{score:alpha,move:best};};
CK.aiMove=function(b,side,depth){var res=CK.negamax(b,depth,-Infinity,Infinity,side);
  return res.move||CK.moves(b,side)[0];};

/* ============ checkers UI ============ */
var curMode='ai',board=null,turn=1,sel=null,legal=[],busy=false;
function startCheckers(mode){
  curMode=mode;board=CK.newBoard();turn=1;sel=null;legal=[];busy=false;
  $('s_over').classList.remove('on');
  show('s_game');render();
}
function sideName(s){if(curMode==='2p')return s>0?'שחקן 1 (אדום)':'שחקן 2 (לבן)';return s>0?'תורך (אדום)':'המחשב חושב...';}
function render(){
  var w=$('boardWrap');w.innerHTML='';
  var t=document.createElement('table');t.className='board';
  for(var r=0;r<8;r++){var tr=document.createElement('tr');
    for(var c=0;c<8;c++){var td=document.createElement('td');
      td.className='sq '+((r+c)%2===0?'lt':'dk');
      td.dataset.r=r;td.dataset.c=c;
      if(sel&&sel[0]===r&&sel[1]===c)td.classList.add('sel');
      var mv=legal.find(function(m){return m.tr===r&&m.tc===c;});
      if(mv)td.classList.add(mv.captures.length?'cap':'dot');
      var v=board[r][c];
      if(v){var d=document.createElement('div');
        d.className='pc '+(v>0?'r':'w')+(CK.king(v)?' k':'');td.appendChild(d);}
      (function(cell){cell.addEventListener('click',function(){onTap(+cell.dataset.r,+cell.dataset.c);});})(td);
      tr.appendChild(td);}
    t.appendChild(tr);}
  w.appendChild(t);
  $('turnTxt').innerHTML=gameOver()? '':sideName(turn);
  var rc=0,rk=0,wc=0,wk=0;
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){var v=board[r][c];
    if(v===1)rc++;if(v===2)rk++;if(v===-1)wc++;if(v===-2)wk++;}
  $('capsTxt').innerHTML='<span>אדום: '+(rc+rk)+'</span><span>לבן: '+(wc+wk)+'</span>';
  checkEnd();
}
function gameOver(){return !CK.moves(board,turn).length;}
function onTap(r,c){
  if(busy||gameOver())return;
  if(curMode==='ai'&&turn<0)return;
  var v=board[r][c];
  var mv=legal.find(function(m){return m.tr===r&&m.tc===c;});
  if(sel&&mv){doMove(mv);return;}
  if(v&&CK.own(v,turn)){
    var all=CK.moves(board,turn);
    var mine=all.filter(function(m){return m.fr===r&&m.fc===c;});
    if(!mine.length){sel=null;legal=[];render();return;}
    sel=[r,c];legal=mine;render();return;}
  sel=null;legal=[];render();
}
function doMove(m){
  board=CK.apply(board,m);sel=null;legal=[];turn=-turn;render();
  if(gameOver())return;
  if(curMode==='ai'&&turn<0){
    busy=true;render();
    setTimeout(function(){
      var am=CK.aiMove(board,-1,4);
      board=CK.apply(board,am);turn=-turn;busy=false;render();
    },450);
  }
}
function checkEnd(){
  var ms=CK.moves(board,turn);
  if(ms.length)return;
  var winner=-turn;
  var name;
  if(curMode==='2p')name=winner>0?'שחקן 1 (אדום) ניצח!':'שחקן 2 (לבן) ניצח!';
  else name=winner>0?'ניצחת! 🏆':'המחשב ניצח';
  setTimeout(function(){$('overTitle').textContent=name;$('s_over').classList.add('on');},350);
}
</script>
</body>
</html>
