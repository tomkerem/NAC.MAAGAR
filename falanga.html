        .colors-grid {

    let selectedColors = [];

    function renderChips() {
        const allColors = new Set();
        falangasData.forEach(item => item.colors.forEach(c => allColors.add(c)));

        const sortedColors = Array.from(allColors).sort();
        const container = document.getElementById('color-chips');
        container.innerHTML = "";

        sortedColors.forEach(color => {
            const chip = document.createElement('div');
            chip.className = 'color-chip';
            if (selectedColors.includes(color)) chip.classList.add('selected');

            const hex = colorHexMap[color] || '#888888';
            chip.innerHTML = `<span class="dot" style="background-color: ${hex}"></span>${color}`;
            chip.onclick = () => toggleColor(color);
            container.appendChild(chip);
        });
    }

    // ציור חבל מלופף ריאליסטי על גבי Canvas
    function drawTwistedRope() {
        const canvas = document.getElementById('ropeCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (selectedColors.length === 0) {
            ctx.fillStyle = "#666666";
            ctx.font = "16px Rubik, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("בחר צבעים למעלה כדי לראות את החבל המלופף...", canvas.width / 2, canvas.height / 2 + 5);
            return;
        }

        const hexColors = selectedColors.map(c => colorHexMap[c] || '#888');
        const totalSegments = 32;
        const segmentWidth = canvas.width / totalSegments;
        const centerY = canvas.height / 2;
        const ropeRadius = 16;

        for (let i = 0; i < totalSegments; i++) {
            const x = i * segmentWidth;
            const colorIndex = i % hexColors.length;
            const color = hexColors[colorIndex];

            ctx.save();
            ctx.beginPath();

            // יצירת צורת אלכסון מלופפת של חבל קלוי
            ctx.moveTo(x - 5, centerY - ropeRadius);
            ctx.lineTo(x + segmentWidth + 5, centerY - ropeRadius + 6);
            ctx.lineTo(x + segmentWidth - 5, centerY + ropeRadius);
            ctx.lineTo(x - 15, centerY + ropeRadius - 6);
            ctx.closePath();

            // מילוי בצבע שנבחר
            ctx.fillStyle = color;
            ctx.fill();

            // הצללת עומק לתחושת חבל מלופף ותלת-ממדי
            const gradient = ctx.createLinearGradient(x, centerY - ropeRadius, x, centerY + ropeRadius);
            gradient.addColorStop(0, 'rgba(255,255,255,0.3)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = gradient;
            ctx.fill();

            // קווי מתאר דקים של ליפוף הסיבים
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
    
        }
    }

function toggleColor(color) {
        if (selectedColors.includes(color)) {
            selectedColors = selectedColors.filter(c => c !== color);
        } else {
            if (selectedColors.
length >= 3) return;
            selectedColors.push(color);
        }
        document.getElementById('status-text').textContent = `נבחרו ${selectedColors.length} מתוך 3 צבעים`;
        renderChips();
        drawTwistedRope();
    }

    function clearSelection() {
        selectedColors = [];
        document.getElementById('status-text').textContent = `נבחרו 0 מתוך 3 צבעים`;
        document.getElementById('results').innerHTML = '<div class="empty-state">בחר שלושה צבעים וחפש פלנגה</div>';
        renderChips();
        drawTwistedRope();
    }

    function findFalangas() {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "";

        if (selectedColors.length === 0) {
            resultsDiv.innerHTML = '<div class="empty-state">בחר שלושה צבעים וחפש פלנגה</div>';
            return;
        }

        const matches = falangasData.map(item => {
            const matchCount = selectedColors.filter(color => item.colors.includes(color)).length;
            return { ...item, matchCount };
        }).filter(item => item.matchCount > 0);

        matches.sort((a, b) => b.matchCount - a.matchCount);

        if (matches.length === 0) {
            resultsDiv.innerHTML = '<div class="empty-state">לא נמצאה פלנגה תואמת לשילוב הצבעים שנבחר.</div>';
            return;
        }

        matches.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';

            let tagsHtml = item.colors.map(color => {
                const isMatched = selectedColors.includes(color);
                const hex = colorHexMap[color] || '#888';
                return `<span class="tag ${isMatched ? 'matched' : ''}">
                  <span class="dot" style="background-color: ${hex}"></span>
                  ${color}
                </span>`;
            }).join('');

            card.innerHTML = `
        <span class="card-year">${item.year}</span>
        <h3 class="card-title">${item.name}</h3>
        <div class="tag-container">${tagsHtml}</div>
      `;

            resultsDiv.appendChild(card);
        });
    }

    renderChips();
    drawTwistedRope();
</script>
