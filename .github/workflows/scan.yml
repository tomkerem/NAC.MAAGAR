name: scan-archive
on:
  push:
    paths:
      - '.github/workflows/scan.yml'
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for sign-in HTML disguised as files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,glob,json,subprocess,urllib.request
          bad=[]
          n=0
          for root,_,fs in os.walk('archive'):
              for f in fs:
                  if f.endswith('.html'): continue
                  p=os.path.join(root,f); n+=1
                  h=open(p,'rb').read(512).lower()
                  if b'<html' in h or b'<!doctype' in h or b'accounts.google' in h:
                      bad.append(p)
          rel=[]
          out=subprocess.check_output(['gh','api','repos/${{ github.repository }}/releases','--paginate','--jq','.[].assets[]|[.name,.browser_download_url,.size]|@tsv']).decode().splitlines()
          rb=[]
          for l in out:
              nm,u,sz=l.split('\t')
              if nm.endswith('.html'): continue
              try:
                  r=urllib.request.Request(u,headers={'Range':'bytes=0-511'})
                  h=urllib.request.urlopen(r,timeout=30).read(512).lower()
                  if b'<html' in h or b'<!doctype' in h or b'accounts.google' in h: rb.append([nm,sz])
              except Exception as e:
                  rb.append([nm,'ERR '+str(e)[:40]])
          json.dump({'repo_files_scanned':n,'repo_bad':bad,'release_scanned':len(out),'release_bad':rb},open('manifest/scan.json','w'),indent=1)
          PY
          git config user.name archive-bot; git config user.email archive-bot@users.noreply.github.com
          git add manifest/scan.json; git commit -m "scan result"; git pull --rebase origin main; git push origin HEAD:main
